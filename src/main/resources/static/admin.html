<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理员后台</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Microsoft YaHei', Arial, sans-serif; }
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .container {
            display: flex;
            height: calc(100vh - 70px);
        }
        .sidebar {
            width: 200px;
            background: #2c3e50;
            color: white;
            padding: 20px 0;
        }
        .menu-item {
            padding: 15px 20px;
            cursor: pointer;
            transition: background 0.3s;
        }
        .menu-item:hover, .menu-item.active {
            background: #34495e;
        }
        .content {
            flex: 1;
            padding: 30px;
            overflow-y: auto;
        }
        .btn {
            padding: 10px 20px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-right: 10px;
        }
        .btn:hover { opacity: 0.8; }
        .btn-danger { background: #e74c3c; }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            background: white;
        }
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        th {
            background: #f8f9fa;
            font-weight: bold;
        }
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 10px;
            width: 500px;
            max-height: 80vh;
            overflow-y: auto;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        .form-group input, .form-group select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        .search-box {
            margin-bottom: 20px;
        }
        .search-box input {
            padding: 10px;
            width: 300px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div class="header">
        <h2>学生成绩管理系统 - 管理员</h2>
        <div>
            <span id="userName"></span>
            <button class="btn" onclick="logout()">退出</button>
        </div>
    </div>
    <div class="container">
        <div class="sidebar">
            <div class="menu-item active" onclick="showSection('teachers')">教师管理</div>
            <div class="menu-item" onclick="showSection('courses')">课程管理</div>
        </div>
        <div class="content">
            <div id="teachers-section">
                <h2>教师管理</h2>
                <button class="btn" onclick="showAddTeacherModal()">添加教师</button>
                <table id="teachersTable">
                    <thead>
                        <tr>
                            <th>用户名</th>
                            <th>姓名</th>
                            <th>手机号</th>
                            <th>邮箱</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>

            <div id="courses-section" style="display:none;">
                <h2>课程管理</h2>
                <button class="btn" onclick="showAddCourseModal()">添加课程</button>
                <div class="search-box">
                    <input type="text" id="courseSearch" placeholder="搜索课程名称">
                    <button class="btn" onclick="searchCourses()">搜索</button>
                    <select id="semesterFilter" onchange="filterBySemester()">
                        <option value="">全部学期</option>
                    </select>
                </div>
                <table id="coursesTable">
                    <thead>
                        <tr>
                            <th>课程编号</th>
                            <th>课程名称</th>
                            <th>学分</th>
                            <th>学期</th>
                            <th>授课教师</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- 添加教师模态框 -->
    <div id="teacherModal" class="modal">
        <div class="modal-content">
            <h3>添加教师</h3>
            <form id="teacherForm">
                <div class="form-group">
                    <label>用户名</label>
                    <input type="text" id="teacherUsername" required>
                </div>
                <div class="form-group">
                    <label>密码</label>
                    <input type="password" id="teacherPassword" required>
                </div>
                <div class="form-group">
                    <label>姓名</label>
                    <input type="text" id="teacherName" required>
                </div>
                <div class="form-group">
                    <label>手机号</label>
                    <input type="text" id="teacherPhone">
                </div>
                <div class="form-group">
                    <label>邮箱</label>
                    <input type="email" id="teacherEmail">
                </div>
                <button type="submit" class="btn">保存</button>
                <button type="button" class="btn btn-danger" onclick="closeModal('teacherModal')">取消</button>
            </form>
        </div>
    </div>

    <!-- 添加课程模态框 -->
    <div id="courseModal" class="modal">
        <div class="modal-content">
            <h3 id="courseModalTitle">添加课程</h3>
            <form id="courseForm">
                <input type="hidden" id="courseId">
                <div class="form-group">
                    <label>课程编号</label>
                    <input type="text" id="courseCode" required>
                </div>
                <div class="form-group">
                    <label>课程名称</label>
                    <input type="text" id="courseName" required>
                </div>
                <div class="form-group">
                    <label>学分</label>
                    <input type="number" step="0.5" id="courseCredit" required>
                </div>
                <div class="form-group">
                    <label>学期</label>
                    <input type="text" id="courseSemester" placeholder="例如：2024-1" required>
                </div>
                <div class="form-group">
                    <label>授课教师</label>
                    <select id="courseTeacher" required>
                        <option value="">请选择教师</option>
                    </select>
                </div>
                <button type="submit" class="btn">保存</button>
                <button type="button" class="btn btn-danger" onclick="closeModal('courseModal')">取消</button>
            </form>
        </div>
    </div>

    <script src="common.js"></script>
    <script>
        let teachers = [];
        let courses = [];

        async function init() {
            checkAuth('ADMIN');
            const user = JSON.parse(localStorage.getItem('user'));
            document.getElementById('userName').textContent = user.realName;
            await loadTeachers();
            await loadCourses();
        }

        async function loadTeachers() {
            teachers = await apiGet('/user/teachers');
            renderTeachers(teachers);
        }

        function renderTeachers(data) {
            const tbody = document.querySelector('#teachersTable tbody');
            tbody.innerHTML = data.map(t => `
                <tr>
                    <td>${t.username}</td>
                    <td>${t.realName}</td>
                    <td>${t.phone || '-'}</td>
                    <td>${t.email || '-'}</td>
                    <td>
                        <button class="btn btn-danger" onclick="deleteTeacher(${t.id})">删除</button>
                    </td>
                </tr>
            `).join('');
        }

        async function loadCourses() {
            courses = await apiGet('/course/list');
            renderCourses(courses);
            updateSemesterFilter();
            await loadTeachersForSelect();
        }

        function renderCourses(data) {
            const tbody = document.querySelector('#coursesTable tbody');
            tbody.innerHTML = data.map(c => `
                <tr>
                    <td>${c.courseCode}</td>
                    <td>${c.courseName}</td>
                    <td>${c.credit}</td>
                    <td>${c.semester}</td>
                    <td>${c.teacherName || '-'}</td>
                    <td>
                        <button class="btn" onclick="editCourse(${c.id})">编辑</button>
                        <button class="btn btn-danger" onclick="deleteCourse(${c.id})">删除</button>
                    </td>
                </tr>
            `).join('');
        }

        function updateSemesterFilter() {
            const semesters = [...new Set(courses.map(c => c.semester))];
            const select = document.getElementById('semesterFilter');
            select.innerHTML = '<option value="">全部学期</option>' + 
                semesters.map(s => `<option value="${s}">${s}</option>`).join('');
        }

        async function loadTeachersForSelect() {
            const select = document.getElementById('courseTeacher');
            select.innerHTML = '<option value="">请选择教师</option>' + 
                teachers.map(t => `<option value="${t.id}">${t.realName}</option>`).join('');
        }

        function showSection(section) {
            document.querySelectorAll('.menu-item').forEach(item => item.classList.remove('active'));
            event.target.classList.add('active');
            document.getElementById('teachers-section').style.display = section === 'teachers' ? 'block' : 'none';
            document.getElementById('courses-section').style.display = section === 'courses' ? 'block' : 'none';
        }

        function showAddTeacherModal() {
            document.getElementById('teacherForm').reset();
            document.getElementById('teacherModal').style.display = 'flex';
        }

        function showAddCourseModal() {
            document.getElementById('courseForm').reset();
            document.getElementById('courseId').value = '';
            document.getElementById('courseModalTitle').textContent = '添加课程';
            document.getElementById('courseModal').style.display = 'flex';
        }

        async function editCourse(id) {
            const course = courses.find(c => c.id === id);
            document.getElementById('courseId').value = course.id;
            document.getElementById('courseCode').value = course.courseCode;
            document.getElementById('courseName').value = course.courseName;
            document.getElementById('courseCredit').value = course.credit;
            document.getElementById('courseSemester').value = course.semester;
            document.getElementById('courseTeacher').value = course.teacherId || '';
            document.getElementById('courseModalTitle').textContent = '编辑课程';
            document.getElementById('courseModal').style.display = 'flex';
        }

        function closeModal(modalId) {
            document.getElementById(modalId).style.display = 'none';
        }

        document.getElementById('teacherForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const data = {
                username: document.getElementById('teacherUsername').value,
                password: document.getElementById('teacherPassword').value,
                realName: document.getElementById('teacherName').value,
                phone: document.getElementById('teacherPhone').value,
                email: document.getElementById('teacherEmail').value,
                role: 'TEACHER'
            };
            await apiPost('/user/create', data);
            alert('添加成功');
            closeModal('teacherModal');
            await loadTeachers();
        });

        document.getElementById('courseForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = document.getElementById('courseId').value;
            const data = {
                id: id || undefined,
                courseCode: document.getElementById('courseCode').value,
                courseName: document.getElementById('courseName').value,
                credit: parseFloat(document.getElementById('courseCredit').value),
                semester: document.getElementById('courseSemester').value,
                teacherId: parseInt(document.getElementById('courseTeacher').value) || null
            };
            
            if (id) {
                await apiPut('/course/update', data);
                alert('更新成功');
            } else {
                await apiPost('/course/create', data);
                alert('添加成功');
            }
            closeModal('courseModal');
            await loadCourses();
        });

        async function deleteTeacher(id) {
            if (confirm('确定删除该教师？')) {
                await apiDelete(`/user/${id}`);
                alert('删除成功');
                await loadTeachers();
            }
        }

        async function deleteCourse(id) {
            if (confirm('确定删除该课程？')) {
                await apiDelete(`/course/${id}`);
                alert('删除成功');
                await loadCourses();
            }
        }

        function searchCourses() {
            const keyword = document.getElementById('courseSearch').value;
            if (keyword) {
                apiGet(`/course/search/name?courseName=${keyword}`).then(renderCourses);
            } else {
                renderCourses(courses);
            }
        }

        function filterBySemester() {
            const semester = document.getElementById('semesterFilter').value;
            if (semester) {
                apiGet(`/course/search/semester?semester=${semester}`).then(renderCourses);
            } else {
                renderCourses(courses);
            }
        }

        init();
    </script>
</body>
</html>
