server:
  port: 8086

spring:
  application:
    name: gateway-service
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration
  cloud:
    nacos:
      config:
        import-check:
          enabled: false
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/user/**
        - id: book-service
          uri: lb://book-service
          predicates:
            - Path=/book/**
        - id: borrow-service
          uri: lb://borrow-service
          predicates:
            - Path=/borrow/**
        - id: notice-service
          uri: lb://notice-service
          predicates:
            - Path=/notice/**
    sentinel:
      transport:
        dashboard: 127.0.0.1:8090
        port: 8721
      eager: true
      scg:
        fallback:
          mode: response
          response-status: 429
          response-body: "{\"code\":429,\"message\":\"Request rate too high, please try later\"}"
  zipkin:
    base-url: http://127.0.0.1:9411
  sleuth:
    sampler:
      probability: 1.0

jwt:
  secret: library-secret-key-2024-campus-library-system
  expiration: 86400000

logging:
  level:
    com.library.gateway: DEBUG
